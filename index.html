<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- CSP notes:
     - 'unsafe-inline' for script-src: the bundled app block is an inline <script> (no nonce).
       Removing this would require a nonce-based approach or external script file.
     - 'unsafe-inline' for style-src: every component uses inline style= props by design.
       Removing this would require a full styling refactor.
     - Google Fonts: font-src and style-src allow fonts.gstatic.com and fonts.googleapis.com
       because the dashboard loads Playfair Display, Newsreader, Inter Tight, Courier Prime.
     - connect-src http://*:3002 is the history daemon. CONFIG.HISTORY_BASE targets port
       3002 on whatever host served the page, which a static CSP cannot name, so any
       host is allowed on that one port over http.
     - frame-ancestors 'none': prevents clickjacking.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.kraken.com https://api.coingecko.com https://mempool.space https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.rss2json.com http://localhost:3001 http://127.0.0.1:3001 http://localhost:3002 http://127.0.0.1:3002 http://*:3002; frame-ancestors 'none';">
<title>The Daily Node — Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter+Tight:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #f3eee4;
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: inherit;
  }
  #canvas {
    width: calc(var(--u) * 1920);
    height: calc(var(--u) * 1080);
    flex-shrink: 0;
    overflow: hidden;
  }
  /* SYNC: must match isMobile check in updateScale() and useViewportMode(900) in App.jsx */
  @media (max-width: 900px) {
    #canvas { width: 100vw; height: auto; min-height: 100vh; }
    #stage { align-items: flex-start; overflow-y: auto; scrollbar-width: none; }
    #stage::-webkit-scrollbar { display: none; }
  }
  @keyframes live-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.75); }
  }
  .live-dot {
    display: inline-block;
    width: calc(var(--u) * 6); height: calc(var(--u) * 6);
    border-radius: 50%;
    background: #9c2a1a;
    margin-right: calc(var(--u) * 5);
    position: relative; top: -1px;
    animation: pulse-dot 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  .live-dot-static {
    display: inline-block;
    width: calc(var(--u) * 6); height: calc(var(--u) * 6);
    border-radius: 50%;
    background: #b8b0a0;
    margin-right: calc(var(--u) * 5);
    position: relative; top: -1px;
    flex-shrink: 0;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  a { text-decoration: none; color: inherit; }
  /* Scrollbars are hidden everywhere. Overflow is hinted by ScrollHint.jsx instead. */
  .no-scrollbar, .scroll-hint { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar, .scroll-hint::-webkit-scrollbar { display: none; }
  /* ScrollHint sets data-more-above / data-more-below from measured overflow; the
     mask fades the content itself on that edge, so it needs no theme colour. */
  /* Capped at a quarter of the region so a short one (the lead summary) never fades away. */
  .scroll-hint { --fade: min(calc(var(--u) * 44), 25%); outline: none; }
  .scroll-hint[data-more-below] {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade)), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade)), transparent);
  }
  .scroll-hint[data-more-above] {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade));
            mask-image: linear-gradient(to bottom, transparent, #000 var(--fade));
  }
  .scroll-hint[data-more-above][data-more-below] {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
  }
  /* Inset: the mask clips anything outside the border box, an outset ring included. */
  .scroll-hint:focus-visible { outline: 1px dotted var(--ink3); outline-offset: -2px; }
  .scroll-more {
    position: absolute; right: 0; bottom: 0;
    border: none; cursor: pointer;
    font-size: calc(var(--u) * 10); font-weight: 700;
    letter-spacing: calc(var(--u) * 1.8); text-transform: uppercase;
    padding: calc(var(--u) * 2) 0 calc(var(--u) * 2) calc(var(--u) * 6);
  }
  /* --u is pinned to 1px at <= 900px, so give the mobile layout real sizes. SYNC: 900px as above. */
  @media (max-width: 900px) {
    .scroll-hint { --fade: min(40px, 25%); }
    .scroll-more { font-size: 10px; letter-spacing: 1.6px; padding: 4px 0 4px 8px; }
  }
  :root {
    --u: 1px;       /* updated by JS — scale factor for 1920×1080 design */
    --u-scale: 1;   /* unitless version of --u for CSS transform: scale() */
    --f-serif:    "Playfair Display", Georgia, serif;
    --f-body:     "Newsreader", Georgia, serif;
    --f-sans:     "Inter Tight", system-ui, sans-serif;
    --f-mono:        "Courier Prime", "Courier New", monospace;
    --f-num-display: "Playfair Display", Georgia, serif;
    --f-num:         "Newsreader", Georgia, serif;
    --n-hero:   68px;
    --n-lg:     32px;
    --n-md:     22px;
    --n-sm:     16px;
    --n-xs:     12px;
    --ink:      #16130f;
    --ink2:     #4a4438;
    --ink3:     #726b5e;
    --ink4:     #b8b0a0;
    --paper:    #f3eee4;
    --paper2:   #ebe4d6;
    --rule:     rgba(26,23,20,1);
    --rule2:    rgba(26,23,20,0.18);
    --rule3:    rgba(26,23,20,0.08);
    --orange:   #c8641a;
    --red:      #9c2a1a;
    --green:    #3a6b2e;
  }
</style>

 creates 184 billion BTC. A patched chain overtakes it 53 blocks later."},{mo:8,d:18,y:2008,t:"The bitcoin.org domain name is registered."},{mo:8,d:19,y:2013,t:"Germany's finance ministry classifies Bitcoin as a unit of account, a form of private money."},{mo:8,d:22,y:2008,t:"Satoshi emails Wei Dai about b-money while drafting the Bitcoin white paper."},{mo:8,d:23,y:2016,t:"Bitcoin Core 0.13.0 is released, adding compact block relay and child-pays-for-parent mining."},{mo:8,d:24,y:2017,t:"SegWit activates at block 481,824, clearing the path for the Lightning Network."},{mo:8,d:27,y:2010,t:"Satoshi releases Bitcoin 0.3.11 with an alert system to warn nodes of needed security upgrades."},{mo:8,d:28,y:2014,t:"Hal Finney, who received the first Bitcoin transaction, dies of ALS at 58."},{mo:8,d:29,y:2023,t:"A US appeals court rules the SEC was wrong to reject Grayscale's spot Bitcoin ETF bid."},{mo:9,d:4,y:2012,t:"Exchange Bitfloor reports a theft of about 24,000 BTC, then worth roughly $250,000."},{mo:9,d:6,y:2021,t:"El Salvador buys its first 200 BTC, a day before its Bitcoin law takes effect."},{mo:9,d:7,y:2021,t:"El Salvador becomes the first country to adopt Bitcoin as legal tender."},{mo:9,d:11,y:2012,t:"BitPay announces it has signed up 1,000 merchants to accept Bitcoin."},{mo:9,d:13,y:2021,t:"Bitcoin Core 22.0 is released, adding I2P support and hardware wallet signing via external signers."},{mo:9,d:14,y:2020,t:"MicroStrategy buys 16,796 more BTC for $175 million, bringing its total to 38,250 BTC."},{mo:9,d:15,y:2017,t:"Huobi and OKCoin announce an end to yuan-to-bitcoin trading in China."},{mo:9,d:17,y:2015,t:"The CFTC rules for the first time that Bitcoin is a commodity, in its Coinflip order."},{mo:9,d:18,y:2018,t:"Bitcoin Core 0.16.3 ships an urgent fix for bug CVE-2018-17144."},{mo:9,d:20,y:2018,t:"Bitcoin Core discloses that bug CVE-2018-17144 could also have let miners inflate the BTC supply."},{mo:9,d:23,y:2019,t:"Bakkt launches physically settled Bitcoi obocoin bitcoin ATM, billed as the world's first, opens in a Vancouver coffee shop."},{mo:10,d:31,y:2008,t:"Satoshi Nakamoto publishes the Bitcoin whitepaper to the Cryptography Mailing List."},{mo:11,d:2,y:2023,t:"A Manhattan jury convicts FTX founder Sam Bankman-Fried on all seven fraud and conspiracy counts."},{mo:11,d:3,y:2008,t:"Answering the first whitepaper critique, Satoshi says users could rely on Simplified Payment Verification."},{mo:11,d:6,y:2008,t:"Satoshi writes that Bitcoin can 'win a major battle in the arms race and gain a new territory of freedom.'"},{mo:11,d:8,y:2017,t:"SegWit2x organizers suspend the planned 2 MB hard fork, citing a lack of consensus."},{mo:11,d:9,y:2008,t:"The Bitcoin project is registered on SourceForge."},{mo:11,d:10,y:2021,t:"Bitcoin hits a then-record high of $69,000 on Coinbase and Bitstamp."},{mo:11,d:11,y:2022,t:"FTX files for Chapter 11 bankruptcy. SBF resigns as CEO."},{mo:11,d:13,y:2010,t:"Satoshi releases Bitcoin v0.3.15, which makes the paytxfee setting a per-kilobyte fee."},{mo:11,d:14,y:2021,t:"The Taproot soft fork activates at block 709,632."},{mo:11,d:15,y:2012,t:"WordPress.com begins accepting bitcoin as payment for upgrades."},{mo:11,d:17,y:2008,t:"Satoshi writes he worked through Bitcoin's details 'over the last year and a half while coding it.'"},{mo:11,d:18,y:2013,t:"The US Senate holds its first hearing on bitcoin, 'Beyond Silk Road.'"},{mo:11,d:19,y:2024,t:"Options on BlackRock's iShares Bitcoin Trust (IBIT) begin trading on Nasdaq."},{mo:11,d:20,y:2021,t:"President Bukele announces plans for a bond-financed 'Bitcoin City' in El Salvador."},{mo:11,d:21,y:2023,t:"Binance and founder Changpeng Zhao plead guilty to US anti-money-laundering violations; Binance pays $4.3B."},{mo:11,d:22,y:2009,t:"Satoshi opens the new Bitcoin forum, the community that became Bitcointalk."},{mo:11,d:24,y:2019,t:"Bitcoin Core 0.19.0.1 is released, adding an optional BIP158 block filter index."},{mo:11,d:25,y:2010,t:"Satoshi rele
