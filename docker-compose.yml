# The Daily Node — Docker Compose
#
# 1. Replace the placeholder IPs below with your BitAxe miner IPs.
#    (Or leave BITAXE_IPS unset to configure via the web setup page on first launch.)
# 2. `docker-compose up -d`  (or `docker compose up -d` if using the newer plugin)
# 3. Open http://<host>:3001/ in any browser on your LAN.
#
# Miner IPs entered via the setup page are saved to the `daily-node-config`
# named volume and survive container restarts and image upgrades.

services:
  daily-node:
    image: ghcr.io/githubxsuperkai/the-daily-node:latest
    container_name: daily-node
    ports:
      - "3001:3001"
    # environment:
      # Comma-separated list of BitAxe miner IPs on your LAN.
      # Uncomment and replace with your IPs, or remove to use the web setup page.
      # BITAXE_IPS: "<miner-ip-1>,<miner-ip-2>"
    volumes:
      - daily-node-config:/data
    healthcheck:
      # Probes /api/setup, not / — it returns tiny JSON and proves the config
      # path actually loaded, whereas / serves the whole inlined dashboard
      # bundle on every probe and the client exits without reading it.
      # Interval is deliberately off-harmonic with the dashboard's own 30s
      # miner poll: the server is single-threaded, an unreachable miner can
      # block request handling for ~6s, and a harmonic probe would eventually
      # phase-lock onto that window and report unhealthy while the app is fine.
      # Port is fixed at 3001 — if you override `command:` with --port, update this.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:3001/api/setup',timeout=5); r.read(); sys.exit(0 if r.status==200 else 1)"]
      interval: 45s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  daily-node-config:
