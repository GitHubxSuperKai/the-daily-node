# The Daily Node — Docker Compose
#
# 1. Replace the placeholder IPs below with your BitAxe miner IPs.
#    (Or leave BITAXE_IPS unset to configure via the web setup page on first launch.)
# 2. `docker-compose up -d`  (or `docker compose up -d` if using the newer plugin)
# 3. Open http://<host>:3001/ in any browser on your LAN.
#
# Miner IPs entered via the setup page are saved to the `daily-node-config`
# named volume and survive container restarts and image upgrades.

services:
  daily-node:
    image: ghcr.io/githubxsuperkai/the-daily-node:latest
    container_name: daily-node
    ports:
      - "3001:3001"
    # environment:
      # Comma-separated list of BitAxe miner IPs on your LAN.
      # Uncomment and replace with your IPs, or remove to use the web setup page.
      # BITAXE_IPS: "<miner-ip-1>,<miner-ip-2>"
    volumes:
      - daily-node-config:/data
    healthcheck:
      # Probes /api/setup rather than /: it returns ~66 bytes where / is the
      # inlined dashboard bundle (~300 KB), which the probe would fetch and
      # discard every interval on a single-threaded server. Both endpoints
      # serve startup-cached state, so this is about cost, not fidelity —
      # what it proves is that the request loop is still servicing requests.
      # `retries: 3` is what prevents a false unhealthy: an unreachable miner
      # can block request handling for ~6s (fetch_all_miners joins at
      # FETCH_TIMEOUT+1), and 45s vs the dashboard's 30s poll keeps probes off
      # that window most of the time — but three CONSECUTIVE collisions is the
      # real safeguard.
      # ProxyHandler({}) because urlopen otherwise honours http_proxy from the
      # environment and would route a loopback probe through it.
      # Host and port are fixed — if you override `command:` with --port or
      # --bind, update this line too.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=o.open('http://127.0.0.1:3001/api/setup',timeout=5); r.read(); sys.exit(0 if r.status==200 else 1)"]
      interval: 45s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  daily-node-config:
