<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- CSP notes:
     - 'unsafe-inline' for script-src: the bundled app block is an inline <script> (no nonce).
       Removing this would require a nonce-based approach or external script file.
     - 'unsafe-inline' for style-src: every component uses inline style= props by design.
       Removing this would require a full styling refactor.
     - Google Fonts: font-src and style-src allow fonts.gstatic.com and fonts.googleapis.com
       because the dashboard loads Playfair Display, Newsreader, Inter Tight, Courier Prime.
     - connect-src http://*:3002 is the history daemon. CONFIG.HISTORY_BASE targets port
       3002 on whatever host served the page, which a static CSP cannot name, so any
       host is allowed on that one port over http.
     - frame-ancestors 'none': prevents clickjacking.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.kraken.com https://api.coingecko.com https://mempool.space https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.rss2json.com http://localhost:3001 http://127.0.0.1:3001 http://localhost:3002 http://127.0.0.1:3002 http://*:3002; frame-ancestors 'none';">
<title>The Daily Node — Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter+Tight:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #f3eee4;
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: inherit;
  }
  #canvas {
    width: calc(var(--u) * 1920);
    height: calc(var(--u) * 1080);
    flex-shrink: 0;
    overflow: hidden;
  }
  /* SYNC: must match isMobile check in updateScale() and useViewportMode(900) in App.jsx */
  @media (max-width: 900px) {
    #canvas { width: 100vw; height: auto; min-height: 100vh; }
    #stage { align-items: flex-start; overflow-y: auto; scrollbar-width: none; }
    #stage::-webkit-scrollbar { display: none; }
  }
  @keyframes live-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.75); }
  }
  .live-dot {
    display: inline-block;
    width: calc(var(--u) * 6); height: calc(var(--u) * 6);
    border-radius: 50%;
    background: #9c2a1a;
    margin-right: calc(var(--u) * 5);
    position: relative; top: -1px;
    animation: pulse-dot 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  .live-dot-static {
    display: inline-block;
    width: calc(var(--u) * 6); height: calc(var(--u) * 6);
    border-radius: 50%;
    background: #b8b0a0;
    margin-right: calc(var(--u) * 5);
    position: relative; top: -1px;
    flex-shrink: 0;
  }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  a { text-decoration: none; color: inherit; }
  /* Scrollbars are hidden everywhere. Overflow is hinted by ScrollHint.jsx instead. */
  .no-scrollbar, .scroll-hint { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar, .scroll-hint::-webkit-scrollbar { display: none; }
  /* ScrollHint sets data-more-above / data-more-below from measured overflow; the
     mask fades the content itself on that edge, so it needs no theme colour. */
  /* Capped at a quarter of the region so a short one (the lead summary) never fades away. */
  .scroll-hint { --fade: min(calc(var(--u) * 44), 25%); outline: none; }
  .scroll-hint[data-more-below] {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade)), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - var(--fade)), transparent);
  }
  .scroll-hint[data-more-above] {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade));
            mask-image: linear-gradient(to bottom, transparent, #000 var(--fade));
  }
  .scroll-hint[data-more-above][data-more-below] {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
  }
  /* Inset: the mask clips anything outside the border box, an outset ring included. */
  .scroll-hint:focus-visible { outline: 1px dotted var(--ink3); outline-offset: -2px; }
  .scroll-more {
    position: absolute; right: 0; bottom: 0;
    border: none; cursor: pointer;
    font-size: calc(var(--u) * 10); font-weight: 700;
    letter-spacing: calc(var(--u) * 1.8); text-transform: uppercase;
    padding: calc(var(--u) * 2) 0 calc(var(--u) * 2) calc(var(--u) * 6);
  }
  /* --u is pinned to 1px at <= 900px, so give the mobile layout real sizes. SYNC: 900px as above. */
  @media (max-width: 900px) {
    .scroll-hint { --fade: min(40px, 25%); }
    .scroll-more { font-size: 10px; letter-spacing: 1.6px; padding: 4px 0 4px 8px; }
  }
  :root {
    --u: 1px;       /* updated by JS — scale factor for 1920×1080 design */
    --u-scale: 1;   /* unitless version of --u for CSS transform: scale() */
    --f-serif:    "Playfair Display", Georgia, serif;
    --f-body:     "Newsreader", Georgia, serif;
    --f-sans:     "Inter Tight", system-ui, sans-serif;
    --f-mono:        "Courier Prime", "Courier New", monospace;
    --f-num-display: "Playfair Display", Georgia, serif;
    --f-num:         "Newsreader", Georgia, serif;
    --n-hero:   68px;
    --n-lg:     32px;
    --n-md:     22px;
    --n-sm:     16px;
    --n-xs:     12px;
    --ink:      #16130f;
    --ink2:     #4a4438;
    --ink3:     #726b5e;
    --ink4:     #b8b0a0;
    --paper:    #f3eee4;
    --paper2:   #ebe4d6;
    --rule:     rgba(26,23,20,1);
    --rule2:    rgba(26,23,20,0.18);
    --rule3:    rgba(26,23,20,0.08);
    --red:      #9c2a1a;
    --green:    #3a6b2e;
  }
</style>
<!-- VENDOR -->
</head>
<body>
<div id="stage"><div id="canvas"></div></div>

<script>
const CANVAS_W = 1920, CANVAS_H = 1080;
function updateScale() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const isMobile = vw <= 900; // SYNC: must match useViewportMode(900) in App.jsx and @media (max-width:900px)
  const s = isMobile ? 1 : Math.min(vw / CANVAS_W, vh / CANVAS_H);
  const r = document.documentElement;
  r.style.setProperty('--u', s + 'px');
  r.style.setProperty('--u-scale', s);
}
window.addEventListener('resize', updateScale);
window.addEventListener('load', updateScale);
updateScale();
window.updateScale = updateScale;
</script>

<script>

/* MODULES CONCATENATED BY build.js */
</script>

</body>
</html>
