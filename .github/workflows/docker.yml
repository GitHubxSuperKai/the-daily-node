name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'bitaxe_api.py'
      - 'setup.html'
      - 'src/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'
  # NOTE: the push filter lists every path that alters image bytes, plus this
  # workflow file itself -- and nothing else. Listing this file buys coverage
  # of the publish path when the workflow is edited, at the price of one
  # redundant :latest republish; that trade is deliberate. Both directions of
  # the rule have bitten:
  #   - docker-compose.yml is deliberately absent from the push filter above.
  #     The publish job has no path guard of its own, so listing it here would
  #     republish :latest for a change that alters zero image bytes. It appears
  #     only under pull_request, where it gates the smoke job.
  #   - setup.html is COPY'd by the runtime stage (Dockerfile). It was once
  #     missing from both lists, which left :latest stale until an unrelated
  #     commit happened to touch a listed path.
  # index.html needs no entry of its own: the runtime stage COPYs it
  # --from=build, so it is covered transitively by the build stage's inputs
  # (src/** + build.js + the package files). Separately, the repo-root copy is
  # .dockerignored, so it cannot reach the image at all.
  # The paths: filter above gates the branches: trigger ONLY -- it does not
  # gate tags:. GitHub does not evaluate path filters for tag pushes ("Path
  # filters are not evaluated for pushes of tags" -- workflow-syntax docs,
  # on.<push|pull_request|pull_request_target>.<paths|paths-ignore>), so a
  # release tag still publishes the full metadata-action set -- :v<x.y.z>,
  # :<x.y.z>, :major.minor and :latest -- even when the tagged commit touches
  # nothing listed above.
  # Verified here rather than read off the docs, via a same-commit A/B.
  # 92b5b30 is a docs-only merge (README.md plus two files under docs/)
  # matching zero entries above. It was pushed to main, then tagged v1.2.0
  # seventy seconds later. (History was rewritten since, so 92b5b30 is an
  # orphaned pre-rewrite commit -- reachable on the remote by SHA, but a
  # plain clone lacks the object until `git fetch origin 92b5b30`.)
  #   - main push, 2026-05-09T02:20:28Z -> Build and Deploy ran; Docker did
  #     NOT. The filter demonstrably bites on a branch push.
  #   - tag push,  2026-05-09T02:21:38Z -> Docker ran through to a successful
  #     publish (Actions run 25588998556).
  # Same SHA, same files, same docker.yml -- the filter was already present at
  # that commit -- so the ref is the only variable. v1.2.0 was later re-pushed
  # at e5a97c9 and published again (run 29601122112) off the same zero-match
  # file set.
  # So do NOT "fix" this by splitting tags: into its own unfiltered trigger:
  # there is no gap to close, and one on.push mapping cannot hold two path
  # policies (duplicate YAML key), so it would cost a second workflow file for
  # zero behaviour change. Equally, do not defend the current shape with "the
  # release commit always bumps package.json" -- ship-it tags whatever HEAD is
  # and this repo has no `npm version` step, so that never held; 92b5b30
  # bumped nothing.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'bitaxe_api.py'
      - 'setup.html'
      - 'src/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # PR smoke test: build image for amd64, start it, verify HTTP 200 on /.
  # Does not push.
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The smoke test below uses `docker run`, so it never reads the compose
      # file. Validate the YAML here; the probe itself is executed against the
      # running container further down (asserting a `healthcheck:` key exists
      # would prove nothing — Compose never parses or runs the test string).
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64 only, load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: daily-node:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name dn-smoke -p 3001:3001 daily-node:smoke

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/ -o /dev/null; then
              echo "Server responded after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond within 30s"
          docker logs dn-smoke
          exit 1

      - name: Verify dashboard HTML served
        run: |
          body=$(curl -fsS http://localhost:3001/)
          echo "$body" | head -c 200
          echo "$body" | grep -q "<!doctype html>" || (echo "Dashboard HTML not served" && exit 1)

      - name: Verify API endpoint responds
        run: |
          # No miners configured, but endpoint should still return valid JSON
          curl -fsS http://localhost:3001/api/miners | python3 -c "import sys, json; d = json.load(sys.stdin); assert 'miners' in d and 'count' in d"

      # Runs the EXACT probe string the compose healthcheck ships, inside the
      # image it ships against. A probe with a syntax error, a wrong path or a
      # wrong port resolves fine in `compose config` and only fails here.
      # Note the container is started by `docker run` without --health-cmd, so
      # it has no health status to inspect; executing the probe is the
      # equivalent assertion.
      - name: Verify the shipped healthcheck probe exits 0
        run: |
          docker compose -f docker-compose.yml config --format json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['services']['daily-node']['healthcheck']['test'][-1])" \
            > /tmp/probe.py
          echo "--- probe under test ---"; cat /tmp/probe.py
          docker exec -i dn-smoke python3 - < /tmp/probe.py

      - name: Stop container
        if: always()
        run: docker rm -f dn-smoke || true

  # main push -> :latest; tag push -> :v<version>, :<version>, :major.minor,
  # :latest (four flavors -- see the metadata-action tags: block below)
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
