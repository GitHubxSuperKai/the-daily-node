name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Verify output
        run: |
          test -f "index.html"
          size=$(wc -c < "index.html")
          echo "Bundle size: $size bytes"
          if [ "$size" -lt 250000 ]; then
            echo "ERROR: Bundle suspiciously small (<250KB), build likely broken"
            exit 1
          fi

      - name: Verify vendored React integrity
        run: npm run verify:vendor

      - name: Smoke test
        run: npm run test:smoke

      - name: Unit tests
        run: npm run test:unit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run python tests
        run: npm run test:py
